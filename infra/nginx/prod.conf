# =========================================================
# SUNU MALL — Reverse proxy PROD (TLS)
# Termine le HTTPS et route vers les services internes.
#
# Certificats attendus dans infra/nginx/ssl/ (monté en lecture seule) :
#   fullchain.pem  (ou certificate chain complète)
#   privkey.pem    (clé privée, reste toujours sur le serveur)
# Sans ces fichiers le conteneur ne démarre PAS : c'est voulu, on ne veut
# jamais servir le site sans chiffrement.
# =========================================================

# --- Port 80 : redirige tout vers HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- Port 443 : application ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Forwarder le schéma réel vers Django (indispensable à
    # SECURE_PROXY_SSL_HEADER / SECURE_SSL_REDIRECT en prod).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend:8000;
        # Le flux SSE de suivi livraison (/api/orders/deliveries/{id}/events/)
        # doit transiter sans buffering, sinon les événements giclent par lots.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    # Contrôles de santé publics (probes de l'hébergeur, monitoring, LB).
    location /health/ {
        proxy_pass http://backend:8000;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        # $http_host conserve le port (ex: localhost:8081). Django compare
        # l'en-tête Origin du navigateur au Host reçu pour valider le CSRF :
        # avec $host (sans port), la vérification d'origine échouait en 403.
        proxy_set_header Host $http_host;
    }

    # Statique Django (thème de l'admin, etc.) : servie par WhiteNoise via
    # gunicorn (location /static/ du backend), nginx ne fait que proxifier.
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        expires 7d;
    }

    # Boutique + espaces vendeur/livreur/admin : SPA React servie par nginx.
    location / {
        proxy_pass http://frontend:80;
    }
}