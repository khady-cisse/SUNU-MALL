# Reverse proxy local : route les requêtes vers le bon service
# selon le sous-domaine ou le chemin. À adapter une fois les vrais
# noms de domaine définis (ex: sunumall.sn, vendeur.sunumall.sn).

server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Le flux SSE de suivi livraison (/api/orders/deliveries/{id}/events/)
        # doit transiter sans buffering, sinon les événements giclent par lots.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        # $http_host conserve le port (ex: localhost:8081). Django compare
        # l'en-tête Origin du navigateur au Host reçu pour valider le CSRF :
        # avec $host (sans port), la vérification d'origine échouait en 403.
        proxy_set_header Host $http_host;
    }

    # Statique Django (CSS du thème de l'admin, etc.) : l'admin est servi par
    # le backend, il faut donc que sa statique aille au backend, pas au SPA.
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    # L'espace vendeur est servi par le frontend (routes /merchant),
    # pas par un service dédié — voir infra/docker-compose.dev.yml.

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
